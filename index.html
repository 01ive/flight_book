<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Flights table</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="bundle.js"></script>
    <script src="tabs.js"></script>
</head>

<body>
    <app-tabs active="flight"></app-tabs>

    <div id="manual_entry">
        <form id="addRowForm">
            <input type="date"   id="date_in" required>
            <input type="text"   id="site_in" placeholder="Site" required>
            <input type="time"   id="start_time_in" placeholder="Start time" required>
            <input type="time"   id="duration_in" placeholder="Duration" required step="1">
            <input type="number" id="distance_total_in" placeholder="Distance (m)">
            <input type="number" id="elevation_total" placeholder="Elevation gains (m)">
            <input type="number" id="elevation_over_start" placeholder="Elevation over start (m)">
            <input type="text"   id="analyse_in" placeholder="Analyse" required>
            <input type="text"   id="monitor_in" placeholder="Monitor" required>
            <button type="submit">Enter</button>
        </form>
    </div>
    <supabase-login></supabase-login>

    <p></p>
    <table id="flight_table" class="display">
        <thead>
            <tr>
                <th><input type="checkbox" id="select_all_filtered" title="Sélectionner tous les vols affichés"></th>
                <th>Nbr</th>
                <th>Date</th>
                <th>Site</th>
                <th>Start time</th>
                <th>Duration</th>
                <th>Distance (m)</th>
                <th>elevation gains</th>
                <th>elevation over start</th>
                <th>Analyse</th>
                <th>Monitor</th>
            </tr>
        </thead>
        <tbody id="table_body"></tbody>
    </table>

    <div id="graphs">
        <div id="global_graphs">
            <!-- Chart.js container -->
            <canvas id="nb_flight_chart"></canvas>

            <!-- Chart.js container -->
            <canvas id="nb_flight_solo"></canvas>

            <!-- Chart.js container -->
            <canvas id="nb_flight_per_site"></canvas>

            <!-- Chart.js container -->
            <canvas id="distance_chart"></canvas>
        </div>
    </div>

    <script>
        // Manage Supabase authentication
        supabaseAuth();
        // Get data from Supabase and read flight book
        loadTableFromSupabase(supabaseTableFlightsName).then(supa_data => read_flight_book(supa_data));
        
        // Global variables
        var book_data = null;       // Json data strucure
        var flight_table = null;    // DataTable instance
        
        // Init manual entry form visibility
        document.getElementById('manual_entry').style.visibility = 'hidden';

        function update_charts(data) {
            // Reinit charts (for refresh)
            const all_charts = Chart.instances ? Object.values(Chart.instances) : [];
            all_charts.forEach(chart => chart.destroy());

            // Ignore undefined elements when filtering from DataTables
            const cleanData = (data || []).filter(Boolean);

            const flight_per_year = {};
            const flight_per_site = {};
            const quality_counts = { plouf: 0, maintien: 0, thermique: 0 };

            // Tableaux pour le graphe de performance chronologique (du plus ancien au plus récent)
            const perfLabels = [];
            const perfGains = [];
            const perfOverStart = [];
            const perfDistances = [];
            const perfMeta = [];

            // On parcourt les vols du plus ancien au plus récent pour l'axe temporel
            const chronological = [...cleanData].sort((a, b) => (a.nbr || 0) - (b.nbr || 0));

            chronological.forEach(vol => {
                // 1. Calcul de la durée en minutes
                const [h, m, s] = (vol.duration || "00:00:00").split(':').map(Number);
                const durationMin = (h || 0) * 60 + (m || 0) + (s || 0) / 60;

                // 2. Agrégation par Année (Solo vs École + Temps)
                const year = new Date(vol.date).getFullYear();
                if (!isNaN(year)) {
                    if (!flight_per_year[year]) {
                        flight_per_year[year] = { solo: 0, ecole: 0, total_in_minutes: 0 };
                    }
                    const isSolo = !vol.monitor || vol.monitor.trim().toLowerCase() === 'none';
                    if (isSolo) {
                        flight_per_year[year].solo += 1;
                    } else {
                        flight_per_year[year].ecole += 1;
                    }
                    flight_per_year[year].total_in_minutes += durationMin;
                }

                // 3. Agrégation par Site (nettoyage des espaces et de la casse)
                let rawSite = (vol.site || "Inconnu").trim();
                let words = rawSite.split(/\s+/);
                let site_short_name = "";
                for (let i = 0; i < words.length; i++) {
                    site_short_name += words[i].toLowerCase();
                    if (words[i].length < 4 && i < words.length - 1) {
                        site_short_name += " ";
                    } else {
                        break;
                    }
                }
                // Première lettre en majuscule
                site_short_name = site_short_name.charAt(0).toUpperCase() + site_short_name.slice(1);
                flight_per_site[site_short_name] = (flight_per_site[site_short_name] || 0) + 1;

                // 4. Catégorisation qualitative du vol (Plouf / Maintien / Thermique)
                const gain = Number(vol.elevation_total) || 0;
                const isSivGlitch = (Number(vol.max_vertical_speed) || 0) > 30; // Ignore le glitch GPS SIV #127
                const cleanGain = isSivGlitch ? 0 : gain;

                if (durationMin >= 20 || cleanGain >= 150) {
                    quality_counts.thermique += 1;
                } else if (durationMin >= 10 || cleanGain >= 40) {
                    quality_counts.maintien += 1;
                } else {
                    quality_counts.plouf += 1;
                }

                // 5. Données du graphe de performance (uniquement vols avec trace GPS et hors glitch SIV)
                if (vol.distance_total > 0 && !isSivGlitch) {
                    perfLabels.push(`#${vol.nbr} (${vol.date})`);
                    perfGains.push(Math.round(cleanGain));
                    perfOverStart.push(Math.round(Number(vol.elevation_over_start) || 0));
                    perfDistances.push(+(vol.distance_total / 1000).toFixed(2));
                    perfMeta.push({
                        site: rawSite,
                        duration: vol.duration,
                        glider: vol.gliderType || ''
                    });
                }
            });

            // =========================================================================
            // GRAPHE 1 : Manhattan Empilé (Solo vs École) + Courbe Temps de vol
            // =========================================================================
            const years = Object.keys(flight_per_year).sort();
            const soloVols = years.map(y => flight_per_year[y].solo);
            const ecoleVols = years.map(y => flight_per_year[y].ecole);
            const tpsVols = years.map(y => +(flight_per_year[y].total_in_minutes / 60).toFixed(1));

            new Chart(document.getElementById('nb_flight_chart'), {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [
                        {
                            label: 'Vols Solo',
                            data: soloVols,
                            backgroundColor: '#2196f3',
                            stack: 'vols',
                            yAxisID: 'y',
                            order: 2
                        },
                        {
                            label: 'Vols École / Stage',
                            data: ecoleVols,
                            backgroundColor: '#ff9800',
                            stack: 'vols',
                            yAxisID: 'y',
                            order: 2
                        },
                        {
                            label: 'Temps de vol (h)',
                            data: tpsVols,
                            type: 'line',
                            borderColor: '#4caf50',
                            backgroundColor: '#4caf50',
                            borderWidth: 3,
                            tension: 0.3,
                            yAxisID: 'y1',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        title: { display: true, text: 'Volume annuel : Solo vs École & Heures' },
                        tooltip: {
                            callbacks: {
                                afterBody: (items) => {
                                    const idx = items[0].dataIndex;
                                    const y = years[idx];
                                    const total = soloVols[idx] + ecoleVols[idx];
                                    const avgMin = Math.round(flight_per_year[y].total_in_minutes / total);
                                    return `Total : ${total} vols | Moyenne : ${avgMin} min/vol`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true },
                        y: {
                            stacked: true,
                            position: 'left',
                            title: { display: true, text: 'Nombre de vols' }
                        },
                        y1: {
                            position: 'right',
                            title: { display: true, text: 'Temps de vol (h)' },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });

            // =========================================================================
            // GRAPHE 2 : Profil des vols (Plouf vs Maintien vs Thermique) en Doughnut
            // =========================================================================
            new Chart(document.getElementById('nb_flight_solo'), {
                type: 'doughnut',
                data: {
                    labels: ['Plouf (<10 min)', 'Maintien / Zérotage (10-20 min)', 'Vol Thermique (>20 min ou D+ >150m)'],
                    datasets: [{
                        data: [quality_counts.plouf, quality_counts.maintien, quality_counts.thermique],
                        backgroundColor: ['#90a4ae', '#29b6f6', '#ef5350']
                    }]
                },
                options: {
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } },
                        title: { display: true, text: 'Qualité d\'exploitation des vols' }
                    }
                }
            });

            // =========================================================================
            // GRAPHE 3 : Top 10 des Sites (Barres horizontales triées)
            // =========================================================================
            const sortedSites = Object.entries(flight_per_site)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            new Chart(document.getElementById('nb_flight_per_site'), {
                type: 'bar',
                data: {
                    labels: sortedSites.map(s => s[0]),
                    datasets: [{
                        label: 'Nombre de vols',
                        data: sortedSites.map(s => s[1]),
                        backgroundColor: '#7e57c2'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: 'Top 10 Sites de vol' }
                    }
                }
            });

            // =========================================================================
            // GRAPHE 4 : Performance par vol (Gain Thermique D+ & Distance)
            // =========================================================================
            new Chart(document.getElementById('distance_chart'), {
                type: 'bar',
                data: {
                    labels: perfLabels,
                    datasets: [
                        {
                            label: 'Gain thermique cumulé D+ (m)',
                            data: perfGains,
                            backgroundColor: 'rgba(239, 83, 80, 0.8)',
                            yAxisID: 'yGain',
                            order: 2
                        },
                        {
                            label: 'Gain max / déco (m)',
                            data: perfOverStart,
                            backgroundColor: 'rgba(255, 167, 38, 0.85)',
                            yAxisID: 'yGain',
                            order: 2
                        },
                        {
                            label: 'Distance parcourue (km)',
                            data: perfDistances,
                            type: 'line',
                            borderColor: '#3e95cd',
                            backgroundColor: '#3e95cd',
                            borderWidth: 2,
                            pointRadius: 2,
                            tension: 0.2,
                            yAxisID: 'yDist',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        title: { display: true, text: 'Performance Thermique (D+ cumulé, Plafond / Déco & Distance)' },
                        tooltip: {
                            callbacks: {
                                afterBody: (items) => {
                                    const m = perfMeta[items[0].dataIndex];
                                    return `Site : ${m.site} | Durée : ${m.duration} (${m.glider})`;
                                }
                            }
                        }
                    },
                    scales: {
                        yGain: {
                            position: 'left',
                            beginAtZero: true,
                            title: { display: true, text: 'Gain d\'altitude (m)' }
                        },
                        yDist: {
                            position: 'right',
                            beginAtZero: true,
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Distance trace (km)' }
                        }
                    }
                }
            });
        }

        // update_table
        function update_table(data) {
            const tbody = document.getElementById('table_body');

            // Reinit table data (for refresh)
            tbody.innerHTML = '';
            $('#flight_table').DataTable().clear().destroy();

            data.forEach(vol => {
                const tr = document.createElement('tr');

                // Manage flight link if track file is available or not
                var file_link = vol.nbr;
                if (vol.file_name) {
                    file_link = `<a href="flight.html?file=${getIGCFileUrl(vol.file_name)}">${vol.nbr}</a>`;
                }
                
                // First column: checkbox to select flight for viewing in Track Analyser
                const checkboxHTML = vol.file_name ?
                    `<input type="checkbox" class="flight-select" data-file="${vol.file_name}">` :
                    `<input type="checkbox" class="flight-select" disabled>`;

                tr.innerHTML = `
                    <td>${checkboxHTML}</td>
                    <td>${file_link}</td>
                    <td>${vol.date}</td>
                    <td>${vol.site}</td>
                    <td>${vol.start_time}</td>
                    <td>${vol.duration}</td>
                    <td>${vol.distance_total.toFixed(1)}</td>
                    <td>${vol.elevation_total.toFixed(1)}</td>
                    <td>${vol.elevation_over_start.toFixed(1)}</td>
                    <td>${vol.analyse}</td>
                    <td>${vol.monitor}</td>
                `;
                tbody.appendChild(tr);
            }); // End of data.forEach

            // Create DataTables
            flight_table = $('#flight_table').DataTable({
                order: [[1, 'dec']],  // Order on Nbr column (was shifted by checkbox)
                autoWidth: false,
                columnDefs: [
                    { targets: 0, orderable: false },    // Disable sorting on checkbox column
                    { targets: 9, width: '20%' },    // Analysis column (shifted)
                    { targets: '_all', width: '1%' } // Default
                ],
            });
        }   // End of update_table function

        // Add flight to book data and table
        async function add_flight_to_book(flight) {
            flight.nbr = book_data.length + 1;
            book_data.unshift(flight);
            // Manage flight link if track file is available or not
            var file_link = flight.nbr;
            if (flight.file_name) {
                file_link = `<a href="flight.html?file=${getIGCFileUrl(flight.file_name)}">${flight.nbr}</a>`;
            }
            const checkboxHtml = flight.file_name ?
                `<input type="checkbox" class="flight-select" data-file="${flight.file_name}">` :
                `<input type="checkbox" class="flight-select" disabled>`;

            const newRow = [
                checkboxHtml,
                file_link,
                flight.date,
                flight.site,
                flight.start_time,
                flight.duration,
                flight.distance_total.toFixed(1),
                flight.elevation_total.toFixed(1),
                flight.elevation_over_start.toFixed(1),
                flight.analyse,
                flight.monitor
            ];
            flight_table.row.add(newRow).draw();

            update_charts(book_data);

            // 2. Envoyer les données à Supabase 
            const { data, error } = await supabaseClient
                .from(supabaseTableFlightsName)
                .insert([flight])
                .select(); // On demande à récupérer la ligne créée (avec son ID et son Nbr)

            if (error) {
                alert("Error during recording : " + error.message);
                console.error("Error details :", error);
            } else {
                console.log("Flight recorded successfully !", data);
            }
        }   // End of add_flight_to_book function

        function read_flight_book(data) {
            book_data = data;  // Save book data to global variable
            update_table(book_data);
            update_charts(book_data);
        }

        // Create file reader object
        var file_name = null;
        const file_reader = new FileReader();
        file_reader.addEventListener('load', (event) => {
            let flight = new Flight("flight");
            flight.load_file(event.target.result, file_name);
            active_flight = flight;
            active_flight.process_flight_info();

            var new_flight_data = {};
            new_flight_data = active_flight.flight_info;
            new_flight_data.file_name = active_flight.file_name;
            new_flight_data.nbr = book_data.length + 1;

            new_flight_data.site = "None";
            new_flight_data.monitor = "None";
            let comments = active_flight.comment.split('\n');

            for(line in comments) {
                if (comments[line].search("site:") >= 0) {
                    new_flight_data.site = comments[line].replace("site:", "").trim();
                }
                if (comments[line].search("monitor:") >= 0) {
                    new_flight_data.monitor = comments[line].replace("monitor:", "").trim();
                }
            }
            comments = comments.join('\n');
            new_flight_data.analyse = comments.replace(/site:.*\n?/, '').replace(/monitor:.*\n?/, '').trim();

            add_flight_to_book(new_flight_data);
        });

        // Event on load file button
        const file_selector = document.getElementById('file-selector');
        file_selector.addEventListener('change', (event) => {
            const file_list = event.target.files;
            file_name = file_list[0].name;	// Get only the file name
            file_reader.readAsText(file_list[0]);
        });

        // Envent on manual_entry_button
        document.getElementById('manual_entry_button').addEventListener('click', function () {
            const manual_entry = document.getElementById('manual_entry');
            if (manual_entry.style.visibility === 'hidden') {
                manual_entry.style.visibility = 'visible';
                manual_entry.style.position = 'static';
            } else {
                manual_entry.style.visibility = 'hidden';
                manual_entry.style.position = 'absolute';
            }
        });

        // Event on addRowForm submit button
        document.getElementById('addRowForm').addEventListener('submit', function (e) {
            e.preventDefault();

            new_flight_data = {};

            new_flight_data.date = document.getElementById('date_in').value;
            new_flight_data.site = document.getElementById('site_in').value;
            new_flight_data.start_time = document.getElementById('start_time_in').value;
            new_flight_data.duration = document.getElementById('duration_in').value;
            new_flight_data.distance_total = parseFloat(document.getElementById('distance_total_in').value) || 0;
            new_flight_data.elevation_total = parseFloat(document.getElementById('elevation_total').value) || 0;
            new_flight_data.elevation_over_start = parseFloat(document.getElementById('elevation_over_start').value) || 0;
            new_flight_data.analyse = document.getElementById('analyse_in').value;
            new_flight_data.monitor = document.getElementById('monitor_in').value;
            new_flight_data.file_name = null;
            
            add_flight_to_book(new_flight_data);

            this.reset();

            const manual_entry = document.getElementById('manual_entry');
            manual_entry.style.visibility = 'hidden';
            manual_entry.style.position = 'absolute';
        });

        // Event on save_button_json
        document.getElementById('save_button_json').addEventListener('click', function () {
            const blob = new Blob([JSON.stringify(book_data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vols-export.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // Event on View selected flights button
        document.getElementById('view_selected_button').addEventListener('click', function () {
            const checked = Array.from(document.querySelectorAll('.flight-select:checked')).map(el => el.dataset.file).filter(Boolean);
            if (checked.length === 0) {
                alert('No flights selected');
                return;
            }
            const urls = checked.map(f => getIGCFileUrl(f));
            // const param = encodeURIComponent(urls.join(','));
            const param = urls.join(',');
            window.location.assign('flight.html?files=' + param, '_blank');
        });

        // Event on DataTable search only
        $('#flight_table').DataTable().on('search.dt', () => {
            // Update charts when search is performed
            var filteredData = [];
            $('#flight_table').DataTable().rows({ search: 'applied' }).indexes().each(index => {
                filteredData.push(book_data[index]);
            });
            update_charts(filteredData);
            updateSelectAllCheckbox();
        });

        // Event on DataTable draw (pagination, search, sort)
        $('#flight_table').on('draw.dt', () => {
            highlightMax();
            updateSelectAllCheckbox();
        });

            // Function to highlight max
            function highlightMax() {
            const durationColIndex = 5;             // Index of the "Duration" column (shifted by checkbox)
            const distanceColIndex = 6;             // Index of the "Distance" column (shifted)
            const elevationGainsColIndex = 7;       // Index of the "Elevation gains" column (shifted)
            const elevationOverStartColIndex = 8;   // Index of the "Elevation over start" column (shifted)

            function durationToSeconds(duration) {
                const [h, m, s] = duration.split(':').map(Number);
                return h * 3600 + m * 60 + s;
            }

            var table = $('#flight_table').DataTable();

            // Remove all highlights
            $('#flight_table td').find('.max-search-icon, .max-global-icon').remove();

            // Duration highlight
            var searchDurations = table.column(durationColIndex, { search: 'applied' }).data().toArray();
            var allDurations = table.column(durationColIndex, { search: 'none'}).data().toArray();

            searchDurations = searchDurations.map(d => durationToSeconds(d))
            allDurations = allDurations.map(d => durationToSeconds(d))

            var searchMaxDuration = Math.max.apply(null, searchDurations);
            var allMaxDuration = Math.max.apply(null, allDurations);

            // Distance highlight
            var searchDistances = table.column(distanceColIndex, { search: 'applied' }).data().toArray();
            var allDistances = table.column(distanceColIndex, { search: 'none' }).data().toArray();

            searchDistances = searchDistances.map(d => parseFloat(d));
            allDistances = allDistances.map(d => parseFloat(d));

            var searchMaxDistances = Math.max.apply(null, searchDistances); 
            var allMaxDistances = Math.max.apply(null, allDistances);

            // Elevation gains highlight
            var searchElevationGains = table.column(elevationGainsColIndex, { search: 'applied' }).data().toArray();
            var allElevationGains = table.column(elevationGainsColIndex, { search: 'none' }).data().toArray();

            searchElevationGains = searchElevationGains.map(d => parseFloat(d));
            allElevationGains = allElevationGains.map(d => parseFloat(d));

            var searchMaxElevationGains = Math.max.apply(null, searchElevationGains);
            var allMaxElevationGains = Math.max.apply(null, allElevationGains);

            // Elevation over start highlight
            var searchElevationOverStart = table.column(elevationOverStartColIndex, { search: 'applied' }).data().toArray();
            var allElevationOverStart = table.column(elevationOverStartColIndex, { search: 'none' }).data().toArray();
            
            searchElevationOverStart = searchElevationOverStart.map(d => parseFloat(d));
            allElevationOverStart = allElevationOverStart.map(d => parseFloat(d));
            
            var searchMaxElevationOverStart = Math.max.apply(null, searchElevationOverStart);
            var allMaxElevationOverStart = Math.max.apply(null, allElevationOverStart);

            // Add highlights to the cells
            table.rows({ search: 'applied' }).every(function() {
                var $cell = $(this.node()).find('td').eq(durationColIndex);
                var value = $cell.text();
                if (durationToSeconds(value) === searchMaxDuration) {
                    $cell.append(' <span class="max-search-icon">🏆</span>');
                }
                if (durationToSeconds(value) === allMaxDuration) {
                    $cell.append(' <span class="max-global-icon">🌍</span>');
                }

                $cell = $(this.node()).find('td').eq(distanceColIndex);
                value = $cell.text();
                if (parseFloat(value) === searchMaxDistances) {
                    $cell.append(' <span class="max-search-icon">🏆</span>');
                }
                if (parseFloat(value) === allMaxDistances) {
                    $cell.append(' <span class="max-global-icon">🌍</span>');
                }

                $cell = $(this.node()).find('td').eq(elevationGainsColIndex);
                value = $cell.text();
                if (parseFloat(value) === searchMaxElevationGains) {
                    $cell.append(' <span class="max-search-icon">🏆</span>');
                }
                if (parseFloat(value) === allMaxElevationGains) {
                    $cell.append(' <span class="max-global-icon">🌍</span>');
                }

                $cell = $(this.node()).find('td').eq(elevationOverStartColIndex);
                value = $cell.text();
                if (parseFloat(value) === searchMaxElevationOverStart) {
                    $cell.append(' <span class="max-search-icon">🏆</span>');
                }   
                if (parseFloat(value) === allMaxElevationOverStart) {
                    $cell.append(' <span class="max-global-icon">🌍</span>');
                }
            });
        }

        // --- Select-all (filtered) helpers ---
        function updateSelectAllCheckbox() {
            try {
                const table = $('#flight_table').DataTable();
                if (!table) return;
                const nodes = table.rows({ search: 'applied' }).nodes();
                const $checkboxes = $(nodes).find('.flight-select:enabled');
                const total = $checkboxes.length;
                const checked = $checkboxes.filter(':checked').length;
                const $header = $('#select_all_filtered');
                if ($header.length === 0) return;
                if (total === 0) {
                    $header.prop('checked', false);
                    $header.prop('indeterminate', false);
                    return;
                }
                $header.prop('checked', checked === total);
                $header.prop('indeterminate', checked > 0 && checked < total);
            } catch (e) {
                // ignore if table not ready
            }
        }

        $(document).on('change', '#select_all_filtered', function() {
            const table = $('#flight_table').DataTable();
            if (!table) return;
            const nodes = table.rows({ search: 'applied' }).nodes();
            $(nodes).find('.flight-select:enabled').prop('checked', this.checked);
        });

        $(document).on('change', '.flight-select', function() {
            updateSelectAllCheckbox();
        });
    </script>
</body>
</html>
